<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyWay サーバー疎通確認ツール</title>
    <style>
      body { font-family: sans-serif; max-width: 700px; margin: 30px auto; padding: 0 20px; color: #333; }
      .form-group { margin-bottom: 15px; }
      label { display: block; margin-bottom: 5px; font-weight: bold; }
      input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
      button { padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
      button:hover { background-color: #0056b3; }
      #log-container { margin-top: 20px; border: 1px solid #ccc; border-radius: 4px; background-color: #222; padding: 15px; }
      h3 { margin-top: 0; color: #fff; }
      #log-area { height: 350px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; font-size: 13px; color: #0f0; }
    </style>
  </head>
  <body>
    <h1>SkyWay サーバー疎通確認ツール</h1>
    <p>RTC-API、シグナリング、TURNサーバーへの疎通状況を同一タブ内でテストします。</p>

    <div class="form-group">
      <label for="app-id">Application ID</label>
      <input type="text" id="app-id" placeholder="SkyWay コンソールから取得した Application ID" />
    </div>
    <div class="form-group">
      <label for="secret-key">Secret Key</label>
      <input type="password" id="secret-key" placeholder="SkyWay コンソールから取得した Secret Key" />
    </div>
    <div class="form-group">
      <label for="room-name">Room Name</label>
      <input type="text" id="room-name" value="connectivity-test-room" />
    </div>

    <button id="start-test">疎通確認テストを実行</button>

    <div id="log-container">
      <h3>接続ログ / ステータス遷移</h3>
      <div id="log-area"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
